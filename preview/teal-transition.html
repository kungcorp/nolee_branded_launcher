<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nolee · Clock to cloud</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03090b;color:#d3ece7;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 75% 70%,#052026 0,transparent 53%),#03090b}header{padding:36px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:19px;letter-spacing:-.7px;font-weight:600}.brand span{color:#618a87;font-weight:400;margin-left:16px;font-size:12px;letter-spacing:.08em}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#69918e;border:1px solid #173335;padding:8px 12px;border-radius:30px}main{flex:1;display:flex;flex-direction:column;justify-content:center}.stage{position:relative;min-height:420px;height:min(61vw,620px);overflow:hidden}.stage.grid{background-image:linear-gradient(#3d81792b 1px,transparent 1px),linear-gradient(90deg,#3d81792b 1px,transparent 1px);background-size:42px 42px}canvas{width:100%;height:100%;display:block}.labels{display:grid;grid-template-columns:repeat(3,1fr);width:94%;margin:0 auto;text-align:center}.labels strong{font-size:12px;font-weight:450;letter-spacing:.04em;color:#a2c5bf}.labels p{font-size:11px;color:#527874;margin:8px 0 0}footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:48px 5vw 30px}.note{font-size:11px;color:#527874;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:11px;border:1px solid #244441;border-radius:30px;padding:10px 16px;background:#09202166;color:#b0d2cb;cursor:pointer}button:hover{background:#123935}button:focus-visible{outline:2px solid #64dfc7;outline-offset:4px}button[aria-pressed=true]{background:#163c37;border-color:#438478}@media(max-width:600px){header{padding:24px 6vw}.brand span{display:block;margin:5px 0 0;font-size:10px}.stage{min-height:290px;height:55svh;max-height:450px}.labels p{font-size:9px}.labels strong{font-size:11px}footer{padding:35px 6vw 24px;flex-direction:column;align-items:flex-start}.tag{font-size:8px}}
.adjustments{display:flex;justify-content:center;align-items:center;gap:32px;flex-wrap:wrap;padding:32px 6vw 0}.adjustment{width:220px;display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px;color:#a2c5bf}.adjustment output{color:#6caaa0;font-variant-numeric:tabular-nums}.adjustment input{grid-column:1/-1;width:100%;margin:0;accent-color:#62dbc2;cursor:pointer;min-height:24px}.adjustment input:focus-visible{outline:2px solid #64dfc7;outline-offset:4px;border-radius:4px}@media(max-width:600px){.adjustments{gap:20px}.adjustment{width:100%;max-width:320px}}
@font-face{font-family:Spline;src:url(spline-sans-mono.ttf)}
.stage{height:min(65vh,620px);min-height:360px}.transition-controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 5vw}.transition-status{text-align:center;height:42px;color:#a2c5bf;font-size:13px;letter-spacing:.03em}.transition-status small{display:block;margin-top:8px;color:#527874;font-size:10px}.timeline{width:min(420px,80vw);display:grid;grid-template-columns:1fr auto;gap:8px;color:#6caaa0;font-size:11px}.timeline input{grid-column:1/-1;width:100%;accent-color:#62dbc2}#hold{touch-action:none;user-select:none}a{color:#a2c5bf;font-size:12px}
</style>
</head>
<body>
<header><div class="brand">nolee<span>CLOUD PERSONA</span></div><div class="tag">Clock → Cloud / 02</div></header>
<main>
<div class="stage" id="stage"><canvas id="scene" role="img" aria-label="A clock dial transforms into a translucent teal AI persona."></canvas></div>
<div class="transition-status" id="transition-status" role="status">Your time, at peace.<small>Hold to wake your companion</small></div>
<div class="transition-controls"><button id="hold">Hold to wake</button><button id="replay">Play transition</button><button id="return-clock">Return to clock</button></div>
<div class="transition-controls"><label class="timeline" for="timeline">Transition <output id="timeline-value">0.00 / 3.65 s</output><input id="timeline" type="range" min="0" max="3650" step="10" value="0"></label></div>
<section class="adjustments" aria-label="Persona appearance">
<label class="adjustment" for="eye-thickness">Eye thickness <output id="eye-value" for="eye-thickness">190%</output><input id="eye-thickness" type="range" min="40" max="220" step="5" value="190"></label>
<label class="adjustment" for="eye-spacing">Eye spacing <output id="spacing-value" for="eye-spacing">125%</output><input id="eye-spacing" type="range" min="50" max="180" step="5" value="125"></label>
<label class="adjustment" for="rim-glow">Rim glow <output id="rim-value" for="rim-glow">150%</output><input id="rim-glow" type="range" min="0" max="300" step="5" value="150"></label>
<label class="adjustment" for="rim-blur">Rim glow blur <output id="blur-value" for="rim-blur">15%</output><input id="rim-blur" type="range" min="0" max="400" step="5" value="15"></label>
<button id="reset-appearance">Reset</button>
</section>
</main>
<footer><div class="note">Translucent shell. A little light within.<br>Nolee cloud AI · Appearance preview</div><div class="controls"><a href="teal-persona.html" style="padding:10px">View expressions</a><button id="backdrop" aria-pressed="false">Show backdrop grid</button><button id="motion" aria-pressed="false">Pause motion</button></div></footer>
<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,paused=reduced.matches,time=0,last=0;
let eyeThickness=1.9,eyeSpacing=1.25,rimGlow=1.5,rimBlur=.15;
const eyeSlider=document.getElementById('eye-thickness'),rimSlider=document.getElementById('rim-glow'),spacingSlider=document.getElementById('eye-spacing'),blurSlider=document.getElementById('rim-blur');
const appearanceControls=[[eyeSlider,'eye-value'],[spacingSlider,'spacing-value'],[rimSlider,'rim-value'],[blurSlider,'blur-value']];
function updateAppearance(){eyeThickness=Number(eyeSlider.value)/100;eyeSpacing=Number(spacingSlider.value)/100;rimGlow=Number(rimSlider.value)/100;rimBlur=Number(blurSlider.value)/100;for(const [slider,output] of appearanceControls)document.getElementById(output).value=slider.value+'%';render();}
for(const [slider] of appearanceControls)slider.addEventListener('input',updateAppearance);
document.getElementById('reset-appearance').addEventListener('click',()=>{for(const [slider] of appearanceControls)slider.value=slider.defaultValue;updateAppearance();});
const particles=Array.from({length:90},(_,i)=>({x:Math.sin(i*127.1)*.5,y:(i*.61803398875)%1,size:.7+((i*37)%17)/12,speed:.09+((i*13)%11)/110,phase:i*2.399}));
function resize(){const r=stage.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render();}
function radial(x,y,r,stops){let g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([p,c])=>g.addColorStop(p,c));return g;}
function disc(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function eyes(r,index,t){const blink=index===2?1:smooth(settledTime/1.2)*Math.pow(Math.max(0,Math.cos(t*.65+index*1.9)),48);ctx.strokeStyle='#e5fff5';ctx.lineWidth=r*.053*eyeThickness;ctx.lineCap='round';ctx.shadowColor='#9dffe6';ctx.shadowBlur=r*.065;for(const side of [-1,1]){let x=side*r*.20*eyeSpacing;ctx.beginPath();if(index===2){ctx.moveTo(x-r*.105,r*.065);ctx.quadraticCurveTo(x,r*.15,x+r*.105,r*.065);}else{let h=r*.125*(1-blink)+r*.012;ctx.moveTo(x,-h);ctx.lineTo(x,h);}ctx.stroke();}ctx.shadowBlur=0;}
function orb(x,y,r,index,t,progress=1){
 ctx.save();ctx.translate(x,y+Math.sin(t*.8+index*.85)*r*.025*smooth((progress-.85)/.15));
 ctx.globalAlpha=smooth(progress/.55);
 // The translucent volume is independent of the luminous boundary.
 disc(0,0,r,radial(0,0,r,[[0,'rgba(11,51,47,.025)'],[.65,'rgba(10,71,67,.05)'],[.87,'rgba(17,108,103,.14)'],[.96,'rgba(35,140,130,.10)'],[1,'rgba(35,140,130,0)']]));
 // Blur the actual rim stroke before clipping the interior, so its light spreads outside.
 ctx.save();
 const rimSoftness=r*.012*rimBlur;
 ctx.filter=rimSoftness>0?`blur(${rimSoftness}px)`:'none';
 let rim=ctx.createLinearGradient(-r,-r,r,r);
 rim.addColorStop(0,`rgba(128,255,230,${Math.min(1,.76*rimGlow)})`);
 rim.addColorStop(.28,`rgba(59,185,177,${Math.min(1,.32*rimGlow)})`);
 rim.addColorStop(.65,`rgba(25,140,132,${Math.min(1,.36*rimGlow)})`);
 rim.addColorStop(1,`rgba(104,241,216,${Math.min(1,.68*rimGlow)})`);
 ctx.strokeStyle=rim;ctx.lineWidth=Math.max(.8,r*.013);
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();
 disc(-r*.32,-r*.82,r*.8,radial(-r*.32,-r*.82,r*.8,[[0,'rgba(74,217,192,.12)'],[.35,'rgba(43,183,161,.06)'],[1,'rgba(23,136,125,0)']]));
 disc(r*.2,r*.89,r*.64,radial(r*.2,r*.89,r*.64,[[0,'rgba(46,192,171,.16)'],[1,'rgba(15,99,95,0)']]));
 const breathe=1+Math.sin(t*1.1+index)*.035*smooth((progress-.85)/.15);
 ctx.save();ctx.scale(breathe,breathe);
 ctx.globalAlpha=smooth((progress-.28)/.5);
 // Layered soft light creates a luminous face suspended inside the shell.
 for(const [blur,alpha,scale] of [[.20,.25,1.14],[.10,.48,1],[.047,.62,.90]]){
 ctx.filter=`blur(${Math.max(1,r*blur)}px)`;
 let glow=ctx.createLinearGradient(-r*.5,-r*.2,r*.5,r*.3);glow.addColorStop(0,`rgba(49,211,176,${alpha})`);glow.addColorStop(.48,`rgba(52,223,187,${alpha*.87})`);glow.addColorStop(1,`rgba(16,165,161,${alpha*.82})`);ctx.fillStyle=glow;rounded(-r*.53*scale,-r*.32*scale,r*1.06*scale,r*.64*scale,r*.24);ctx.fill();}
 ctx.filter='none';ctx.globalAlpha=eyeHandoff(progress);eyes(r,index,t);ctx.restore();ctx.restore();
 ctx.globalAlpha=smooth((progress-.72)/.28);
 // Sparse particles drift upward from within the orb and fade into the air.
 if(index>0){for(let i=0;i<(index===1?50:90);i++){const p=particles[i],life=(p.y+t*p.speed*.37)%1;let px=(p.x*r*.96)+Math.sin(t*.6+p.phase)*r*.07*life,py=-r*.52-life*r*1.23;let alpha=Math.sin(life*Math.PI)*.65;const size=p.size*r/190*(index===2?.7:1);disc(px,py,Math.max(.45,size),`rgba(68,224,201,${alpha})`);}}
 ctx.restore();
}
const DURATION=3.65;
let settledTime=0;
let elapsed=0,direction=0,holding=false,committed=false,heldFor=0,clockTime=new Date(),digitDots=[];
const timeline=document.getElementById('timeline'),timelineValue=document.getElementById('timeline-value'),status=document.getElementById('transition-status');
function smooth(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v);}
const EYE_DURATION=2.2;
function eyeProgress(p){return Math.min(1,p*DURATION/EYE_DURATION);}
function eyeHandoff(p){return smooth((eyeProgress(p)-.62)/.38);}
function mix(a,b,p){return a+(b-a)*p;}
function clockString(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function sampleDigits(){
 const scratch=document.createElement('canvas');scratch.width=500;scratch.height=160;const c=scratch.getContext('2d');
 c.font='100px Spline, monospace';c.textAlign='center';c.textBaseline='middle';c.fillStyle='white';
 const text=clockString(clockTime);c.fillText(text,250,80);
 const pixels=c.getImageData(0,0,500,160).data;digitDots=[];
 for(let y=15;y<145;y+=4)for(let x=50;x<450;x+=4){if(Math.abs(x-250)<18)continue;if(pixels[(y*500+x)*4+3]>110)digitDots.push({x:(x-250)/150,y:(y-80)/150,side:x<250?-1:1,seed:digitDots.length});}
}
function syncTransition(){timeline.value=Math.round(elapsed*1000);timelineValue.value=elapsed.toFixed(2)+' / 3.65 s';const label=elapsed===0?'Your time, at peace.':elapsed>=DURATION?"I’m listening":direction<0?'Back to your time':elapsed<1.1?'The dial becomes light':elapsed<2.8?'A presence takes shape':'Here with you';if(status.dataset.label!==label){status.dataset.label=label;status.textContent=label;}}
function begin(auto){settledTime=0;clockTime=new Date();sampleDigits();elapsed=0;direction=1;heldFor=0;committed=auto;paused=false;syncMotion();if(reduced.matches){elapsed=DURATION;direction=0;}syncTransition();}
const hold=document.getElementById('hold');
hold.addEventListener('pointerdown',e=>{if(e.button!==0)return;hold.setPointerCapture(e.pointerId);holding=true;begin(false);});
function release(){if(!holding)return;holding=false;if(!committed)direction=-1;}
hold.addEventListener('pointerup',release);hold.addEventListener('pointercancel',release);hold.addEventListener('lostpointercapture',release);
hold.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();holding=true;begin(false);}});
hold.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release();}});hold.addEventListener('blur',release);
document.getElementById('replay').addEventListener('click',()=>begin(true));
document.getElementById('return-clock').addEventListener('click',()=>{holding=false;committed=false;direction=-1;paused=false;syncMotion();if(reduced.matches){elapsed=0;direction=0;syncTransition();}});
timeline.addEventListener('input',()=>{settledTime=0;if(!digitDots.length){clockTime=new Date();sampleDigits();}elapsed=Number(timeline.value)/1000;direction=0;holding=false;syncTransition();render();});
function drawClock(x,y,base,p,r){
 ctx.save();ctx.translate(x,y);const fade=1-smooth(p/.32),radius=base*1.535;
 ctx.globalAlpha=1-smooth(p/.58);ctx.strokeStyle='#8ac7b5';ctx.lineWidth=1;
 for(let i=0;i<60;i++){const a=i*Math.PI/30-Math.PI/2+Math.sin(i*1.73)*smooth(p/.35)*.14;const outer=mix(radius*1.14,r,smooth(p/.5));const len=(i%5===0?base*.08:base*.033)*(1-smooth(p/.35));ctx.globalAlpha=(1-smooth(p/.4))*(i%5===0?.65:.28);ctx.beginPath();ctx.moveTo(Math.cos(a)*outer,Math.sin(a)*outer);ctx.lineTo(Math.cos(a)*(outer-len),Math.sin(a)*(outer-len));ctx.stroke();}
 ctx.globalAlpha=1-smooth(p/.55);ctx.strokeStyle='#69bca6';ctx.lineWidth=base*.009;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 const sec=clockTime.getSeconds();ctx.strokeStyle='#a5f3d5';ctx.lineWidth=base*.016;ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,-Math.PI/2+mix(sec/60,1,smooth(p/.3))*Math.PI*2);ctx.stroke();
 ctx.globalAlpha=fade;ctx.fillStyle='#d9e8df';ctx.font=`${base*2/3}px Spline,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(clockString(clockTime),0,0);
 ctx.font=`${Math.max(9,base*.065)}px Spline,monospace`;ctx.fillStyle='#759889';ctx.fillText('CHRONO',0,-base*.60);ctx.fillText(String(sec).padStart(2,'0')+'  SECONDS / 60',0,base*.50);
 ctx.restore();
}
function gatherDigits(x,y,base,r,p){
 const eyeP=eyeProgress(p);
 if(eyeP<=0||eyeP>=1)return;
 // Keep gathering until the fade is complete: no settled particle-only phase.
 const travel=Math.max(0,Math.min(1,(eyeP-.05)/.95));
 const gather=travel*travel/(.15+.85*travel),handoff=eyeHandoff(p),alpha=smooth(eyeP/.14)*(1-handoff);
 const awaken=smooth((p-.85)/.15),breathe=1+Math.sin(time*1.1+1)*.035*awaken;
 ctx.save();ctx.translate(x,y+Math.sin(time*.8+.85)*r*.025*awaken);ctx.scale(breathe,breathe);
 ctx.globalAlpha=alpha;ctx.fillStyle='#e5fff5';
 const dotRadius=Math.max(.65,base*.0065)*(1-.35*handoff);
 for(const d of digitDots){
  const u=((d.seed*37)%101)/100,v=((d.seed*61)%103)/102;
  const halfWidth=Math.max(0,r*.053*eyeThickness/2-dotRadius),halfLine=r*.125;
  const ey=(v*2-1)*(halfLine+halfWidth),capY=Math.max(0,Math.abs(ey)-halfLine);
  const span=Math.sqrt(Math.max(0,halfWidth*halfWidth-capY*capY));
  const ex=d.side*r*.20*eyeSpacing+(u*2-1)*span;
  const scatter=Math.sin(gather*Math.PI);
  const px=mix(d.x*base,ex,gather)+Math.cos(d.seed*2.399)*base*.12*scatter;
  const py=mix(d.y*base,ey,gather)+Math.sin(d.seed*2.399)*base*.09*scatter;
  ctx.beginPath();ctx.arc(px,py,dotRadius,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function render(){
 ctx.clearRect(0,0,width,height);const base=Math.min(width*.22,height*.245,165),p=elapsed/DURATION,condense=smooth((elapsed/2.1-.08)/.82),r=mix(base*1.535,base,condense),x=width/2,y=height*.53+base*.1*condense;
 if(elapsed===0)clockTime=new Date();
 drawClock(x,y,base,p,r);orb(x,y,r,1,time,p);gatherDigits(x,y,base,r,p);
}
function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused&&!document.hidden){time+=dt;settledTime=elapsed>=DURATION?settledTime+dt:0;if(holding){heldFor+=dt;if(heldFor>=.65)committed=true;}if(direction){elapsed=Math.max(0,Math.min(DURATION,elapsed+dt*direction*(direction<0?2.5:1)));if(elapsed===0||elapsed===DURATION)direction=0;syncTransition();}}render();requestAnimationFrame(frame);}
const motion=document.getElementById('motion');function syncMotion(){motion.textContent=paused?'Resume motion':'Pause motion';motion.setAttribute('aria-pressed',String(paused));}motion.addEventListener('click',()=>{paused=!paused;syncMotion();});syncMotion();
document.getElementById('backdrop').addEventListener('click',e=>{const active=stage.classList.toggle('grid');e.currentTarget.setAttribute('aria-pressed',String(active));e.currentTarget.textContent=active?'Hide backdrop grid':'Show backdrop grid';});
reduced.addEventListener('change',e=>{paused=e.matches;syncMotion();});new ResizeObserver(resize).observe(stage);resize();document.fonts.ready.then(sampleDigits);requestAnimationFrame(frame);
</script>
</body>
</html>

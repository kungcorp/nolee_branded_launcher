<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nolee · Cloud persona</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03090b;color:#d3ece7;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 75% 70%,#052026 0,transparent 53%),#03090b}header{padding:36px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:19px;letter-spacing:-.7px;font-weight:600}.brand span{color:#618a87;font-weight:400;margin-left:16px;font-size:12px;letter-spacing:.08em}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#69918e;border:1px solid #173335;padding:8px 12px;border-radius:30px}main{flex:1;display:flex;flex-direction:column;justify-content:center}.stage{position:relative;min-height:420px;height:min(61vw,620px);overflow:hidden}.stage.grid{background-image:linear-gradient(#3d81792b 1px,transparent 1px),linear-gradient(90deg,#3d81792b 1px,transparent 1px);background-size:42px 42px}canvas{width:100%;height:100%;display:block}.labels{display:grid;grid-template-columns:repeat(3,1fr);width:94%;margin:0 auto;text-align:center}.labels strong{font-size:12px;font-weight:450;letter-spacing:.04em;color:#a2c5bf}.labels p{font-size:11px;color:#527874;margin:8px 0 0}footer{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:48px 5vw 30px}.note{font-size:11px;color:#527874;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:11px;border:1px solid #244441;border-radius:30px;padding:10px 16px;background:#09202166;color:#b0d2cb;cursor:pointer}button:hover{background:#123935}button:focus-visible{outline:2px solid #64dfc7;outline-offset:4px}button[aria-pressed=true]{background:#163c37;border-color:#438478}@media(max-width:600px){header{padding:24px 6vw}.brand span{display:block;margin:5px 0 0;font-size:10px}.stage{min-height:290px;height:55svh;max-height:450px}.labels p{font-size:9px}.labels strong{font-size:11px}footer{padding:35px 6vw 24px;flex-direction:column;align-items:flex-start}.tag{font-size:8px}}
.adjustments{display:flex;justify-content:center;align-items:center;gap:32px;flex-wrap:wrap;padding:32px 6vw 0}.adjustment{width:220px;display:grid;grid-template-columns:1fr auto;gap:10px;font-size:12px;color:#a2c5bf}.adjustment output{color:#6caaa0;font-variant-numeric:tabular-nums}.adjustment input{grid-column:1/-1;width:100%;margin:0;accent-color:#62dbc2;cursor:pointer;min-height:24px}.adjustment input:focus-visible{outline:2px solid #64dfc7;outline-offset:4px;border-radius:4px}@media(max-width:600px){.adjustments{gap:20px}.adjustment{width:100%;max-width:320px}}
</style>
</head>
<body>
<header><div class="brand">nolee<span>CLOUD PERSONA</span></div><div class="tag">Material study / 01</div></header>
<main>
<div class="stage" id="stage"><canvas id="scene" role="img" aria-label="Three animated translucent teal AI orbs with calm, attentive and relaxed expressions."></canvas></div>
<div class="labels"><div><strong>Calm</strong><p>A quiet presence</p></div><div><strong>Attentive</strong><p>Here with you</p></div><div><strong>Relaxed</strong><p>A softer moment</p></div></div>
<section class="adjustments" aria-label="Persona appearance">
<label class="adjustment" for="eye-thickness">Eye thickness <output id="eye-value" for="eye-thickness">190%</output><input id="eye-thickness" type="range" min="40" max="220" step="5" value="190"></label>
<label class="adjustment" for="eye-spacing">Eye spacing <output id="spacing-value" for="eye-spacing">125%</output><input id="eye-spacing" type="range" min="50" max="180" step="5" value="125"></label>
<label class="adjustment" for="rim-glow">Rim glow <output id="rim-value" for="rim-glow">150%</output><input id="rim-glow" type="range" min="0" max="300" step="5" value="150"></label>
<label class="adjustment" for="rim-blur">Rim glow blur <output id="blur-value" for="rim-blur">15%</output><input id="rim-blur" type="range" min="0" max="400" step="5" value="15"></label>
<button id="reset-appearance">Reset</button>
</section>
</main>
<footer><div class="note">Translucent shell. A little light within.<br>Nolee cloud AI · Appearance preview</div><div class="controls"><a href="teal-transition.html" style="color:#a2c5bf;font-size:12px;padding:10px">Preview clock transition</a><button id="backdrop" aria-pressed="false">Show backdrop grid</button><button id="motion" aria-pressed="false">Pause motion</button></div></footer>
<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,paused=reduced.matches,time=0,last=0;
let eyeThickness=1.9,eyeSpacing=1.25,rimGlow=1.5,rimBlur=.15;
const eyeSlider=document.getElementById('eye-thickness'),rimSlider=document.getElementById('rim-glow'),spacingSlider=document.getElementById('eye-spacing'),blurSlider=document.getElementById('rim-blur');
const appearanceControls=[[eyeSlider,'eye-value'],[spacingSlider,'spacing-value'],[rimSlider,'rim-value'],[blurSlider,'blur-value']];
function updateAppearance(){eyeThickness=Number(eyeSlider.value)/100;eyeSpacing=Number(spacingSlider.value)/100;rimGlow=Number(rimSlider.value)/100;rimBlur=Number(blurSlider.value)/100;for(const [slider,output] of appearanceControls)document.getElementById(output).value=slider.value+'%';render();}
for(const [slider] of appearanceControls)slider.addEventListener('input',updateAppearance);
document.getElementById('reset-appearance').addEventListener('click',()=>{for(const [slider] of appearanceControls)slider.value=slider.defaultValue;updateAppearance();});
const particles=Array.from({length:90},(_,i)=>({x:Math.sin(i*127.1)*.5,y:(i*.61803398875)%1,size:.7+((i*37)%17)/12,speed:.09+((i*13)%11)/110,phase:i*2.399}));
function resize(){const r=stage.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render();}
function radial(x,y,r,stops){let g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([p,c])=>g.addColorStop(p,c));return g;}
function disc(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function eyes(r,index,t){const blink=index===2?1:Math.pow(Math.max(0,Math.cos(t*.65+index*1.9)),48);ctx.strokeStyle='#e5fff5';ctx.lineWidth=r*.053*eyeThickness;ctx.lineCap='round';ctx.shadowColor='#9dffe6';ctx.shadowBlur=r*.065;for(const side of [-1,1]){let x=side*r*.20*eyeSpacing;ctx.beginPath();if(index===2){ctx.moveTo(x-r*.105,r*.065);ctx.quadraticCurveTo(x,r*.15,x+r*.105,r*.065);}else{let h=r*.125*(1-blink)+r*.012;ctx.moveTo(x,-h);ctx.lineTo(x,h);}ctx.stroke();}ctx.shadowBlur=0;}
function orb(x,y,r,index,t){
 ctx.save();ctx.translate(x,y+Math.sin(t*.8+index*.85)*r*.025);
 // The translucent volume is independent of the luminous boundary.
 disc(0,0,r,radial(0,0,r,[[0,'rgba(11,51,47,.025)'],[.65,'rgba(10,71,67,.05)'],[.87,'rgba(17,108,103,.14)'],[.96,'rgba(35,140,130,.10)'],[1,'rgba(35,140,130,0)']]));
 // Blur the actual rim stroke before clipping the interior, so its light spreads outside.
 ctx.save();
 const rimSoftness=r*.012*rimBlur;
 ctx.filter=rimSoftness>0?`blur(${rimSoftness}px)`:'none';
 let rim=ctx.createLinearGradient(-r,-r,r,r);
 rim.addColorStop(0,`rgba(128,255,230,${Math.min(1,.76*rimGlow)})`);
 rim.addColorStop(.28,`rgba(59,185,177,${Math.min(1,.32*rimGlow)})`);
 rim.addColorStop(.65,`rgba(25,140,132,${Math.min(1,.36*rimGlow)})`);
 rim.addColorStop(1,`rgba(104,241,216,${Math.min(1,.68*rimGlow)})`);
 ctx.strokeStyle=rim;ctx.lineWidth=Math.max(.8,r*.013);
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();
 disc(-r*.32,-r*.82,r*.8,radial(-r*.32,-r*.82,r*.8,[[0,'rgba(74,217,192,.12)'],[.35,'rgba(43,183,161,.06)'],[1,'rgba(23,136,125,0)']]));
 disc(r*.2,r*.89,r*.64,radial(r*.2,r*.89,r*.64,[[0,'rgba(46,192,171,.16)'],[1,'rgba(15,99,95,0)']]));
 const breathe=1+Math.sin(t*1.1+index)*.035;
 ctx.save();ctx.scale(breathe,breathe);
 // Layered soft light creates a luminous face suspended inside the shell.
 for(const [blur,alpha,scale] of [[.20,.25,1.14],[.10,.48,1],[.047,.62,.90]]){
 ctx.filter=`blur(${Math.max(1,r*blur)}px)`;
 let glow=ctx.createLinearGradient(-r*.5,-r*.2,r*.5,r*.3);glow.addColorStop(0,`rgba(49,211,176,${alpha})`);glow.addColorStop(.48,`rgba(52,223,187,${alpha*.87})`);glow.addColorStop(1,`rgba(16,165,161,${alpha*.82})`);ctx.fillStyle=glow;rounded(-r*.53*scale,-r*.32*scale,r*1.06*scale,r*.64*scale,r*.24);ctx.fill();}
 ctx.filter='none';eyes(r,index,t);ctx.restore();ctx.restore();
 // Sparse particles drift upward from within the orb and fade into the air.
 if(index>0){for(let i=0;i<(index===1?50:90);i++){const p=particles[i],life=(p.y+t*p.speed*.37)%1;let px=(p.x*r*.96)+Math.sin(t*.6+p.phase)*r*.07*life,py=-r*.52-life*r*1.23;let alpha=Math.sin(life*Math.PI)*.65;const size=p.size*r/190*(index===2?.7:1);disc(px,py,Math.max(.45,size),`rgba(68,224,201,${alpha})`);}}
 ctx.restore();
}
function render(){ctx.clearRect(0,0,width,height);const r=Math.min(width*.132,height*.32,215);const y=height*.57;for(let i=0;i<3;i++)orb(width*(.18+.32*i),y,r,i,time);}
function frame(now){if(last&&!paused&&!document.hidden)time+=Math.min((now-last)/1000,.05);last=now;render();requestAnimationFrame(frame);}
const motion=document.getElementById('motion');function syncMotion(){motion.textContent=paused?'Resume motion':'Pause motion';motion.setAttribute('aria-pressed',String(paused));}motion.addEventListener('click',()=>{paused=!paused;syncMotion();});syncMotion();
document.getElementById('backdrop').addEventListener('click',e=>{const active=stage.classList.toggle('grid');e.currentTarget.setAttribute('aria-pressed',String(active));e.currentTarget.textContent=active?'Hide backdrop grid':'Show backdrop grid';});
reduced.addEventListener('change',e=>{paused=e.matches;syncMotion();});new ResizeObserver(resize).observe(stage);resize();requestAnimationFrame(frame);
</script>
</body>
</html>
